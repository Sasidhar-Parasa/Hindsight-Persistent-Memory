<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#020617" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="accent-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Grid overlay -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <path d="M 0,70 L 1200,70 M 0,140 L 1200,140 M 0,210 L 1200,210 M 0,280 L 1200,280 M 0,350 L 1200,350 M 0,420 L 1200,420 M 0,490 L 1200,490 M 0,560 L 1200,560" />
    <path d="M 120,0 L 120,630 M 240,0 L 240,630 M 360,0 L 360,630 M 480,0 L 480,630 M 600,0 L 600,630 M 720,0 L 720,630 M 840,0 L 840,630 M 960,0 L 960,630 M 1080,0 L 1080,630" />
  </g>

  <!-- Title & Header -->
  <text x="60" y="70" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" letter-spacing="2">HINDSIGHT SYSTEM ARCHITECTURE</text>
  <text x="60" y="105" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800">Decoupled Ephemeral Chat vs Persistent Memory</text>

  <!-- Step 1: User / React Frontend -->
  <g transform="translate(60, 160)" filter="url(#shadow)">
    <rect width="240" height="280" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <rect width="240" height="42" rx="16" fill="#0f172a" />
    <circle cx="24" cy="21" r="5" fill="#ef4444" />
    <circle cx="40" cy="21" r="5" fill="#f59e0b" />
    <circle cx="56" cy="21" r="5" fill="#10b981" />
    <text x="120" y="26" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">React SPA Client</text>
    
    <text x="24" y="80" fill="#60a5fa" font-family="system-ui, sans-serif" font-size="11" font-weight="700">AUTHENTICATED USER</text>
    <text x="24" y="105" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Adi (Data Eng)</text>

    <!-- Mini Chat Mockup -->
    <rect x="20" y="130" width="200" height="46" rx="8" fill="#020617" />
    <text x="32" y="152" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">"Explain what I should</text>
    <text x="32" y="168" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">learn next..."</text>

    <!-- Clear screen tag -->
    <rect x="20" y="190" width="130" height="26" rx="13" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-opacity="0.3" />
    <text x="85" y="207" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">+ New Chat (Clean UI)</text>

    <text x="24" y="250" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Visual state is ephemeral.</text>
    <text x="24" y="268" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Zero prompt transcript bloat.</text>
  </g>

  <!-- Arrow 1 -> 2: Chat message -->
  <g transform="translate(300, 260)">
    <path d="M 10,0 L 100,0" stroke="#3b82f6" stroke-width="2.5" stroke-dasharray="6,4" />
    <polygon points="105,0 95,-5 95,5" fill="#3b82f6" />
    <text x="55" y="-12" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">1. User Query</text>
  </g>

  <!-- Step 2: Express Backend -->
  <g transform="translate(420, 160)" filter="url(#shadow)">
    <rect width="250" height="280" rx="16" fill="#1e293b" stroke="#3b82f6" stroke-width="2" />
    <rect width="250" height="42" rx="16" fill="#0f172a" />
    <text x="125" y="26" fill="#60a5fa" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Express API Gateway</text>

    <text x="24" y="75" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">ISOLATION ORCHESTRATOR</text>
    
    <rect x="20" y="90" width="210" height="48" rx="8" fill="#0f172a" stroke="#334155" />
    <text x="30" y="110" fill="#38bdf8" font-family="monospace" font-size="10">Bank: memorydesk-user_adi</text>
    <text x="30" y="126" fill="#10b981" font-family="monospace" font-size="10">Strict Cryptographic Namespace</text>

    <text x="24" y="165" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12" font-weight="600">• Semantic Pre-Query Recall</text>
    <text x="24" y="188" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12" font-weight="600">• Clean-Slate Conditioning</text>
    <text x="24" y="211" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12" font-weight="600">• Async Background Retain</text>

    <rect x="20" y="235" width="210" height="30" rx="6" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.4" />
    <text x="125" y="254" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Non-blocking Event Loop</text>
  </g>

  <!-- Arrow 2 -> 3: Hindsight Engine Query -->
  <g transform="translate(670, 220)">
    <path d="M 10,0 L 130,0" stroke="#8b5cf6" stroke-width="2.5" />
    <polygon points="135,0 125,-5 125,5" fill="#8b5cf6" />
    <text x="75" y="-12" fill="#c084fc" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">2. Recall Observations</text>
  </g>

  <!-- Arrow 3 -> 2: Return facts -->
  <g transform="translate(670, 270)">
    <path d="M 130,0 L 10,0" stroke="#10b981" stroke-width="2.5" stroke-dasharray="4,4" />
    <polygon points="5,0 15,-5 15,5" fill="#10b981" />
    <text x="75" y="18" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">3. Atomic Facts</text>
  </g>

  <!-- Step 3: Hindsight Engine -->
  <g transform="translate(820, 160)" filter="url(#shadow)">
    <rect width="320" height="280" rx="16" fill="#1e293b" stroke="#8b5cf6" stroke-width="2" />
    <rect width="320" height="42" rx="16" fill="#0f172a" />
    <text x="160" y="26" fill="#a855f7" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Hindsight Agent Memory</text>

    <text x="24" y="75" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">LONG-TERM KNOWLEDGE GRAPH</text>

    <!-- Stored facts pill box -->
    <rect x="20" y="90" width="280" height="74" rx="8" fill="#0f172a" stroke="#334155" />
    <text x="32" y="112" fill="#e2e8f0" font-family="monospace" font-size="10">✓ "Adi is learning Data Engineering"</text>
    <text x="32" y="132" fill="#e2e8f0" font-family="monospace" font-size="10">✓ "Prefers analogies &amp; simplicity"</text>
    <text x="32" y="152" fill="#10b981" font-family="monospace" font-size="10">✓ "Studying ETL pipelines"</text>

    <rect x="20" y="180" width="280" height="68" rx="8" fill="#020617" />
    <text x="32" y="202" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">• Types: observation, world, experience</text>
    <text x="32" y="222" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">• Multi-tenant cryptographic banks</text>
    <text x="32" y="240" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">• Latency: &lt; 90ms p95</text>
  </g>

  <!-- Bottom Panel: Gemini Synthesis Output -->
  <g transform="translate(60, 480)" filter="url(#shadow)">
    <rect width="1080" height="100" rx="14" fill="#0f172a" stroke="#10b981" stroke-width="1.5" />
    <text x="30" y="35" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="700">4. GEMINI 3.8 FLASH WITH RECALLED CONTEXT SYNTHESIS</text>
    <text x="30" y="65" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14">
      "Great to have you back, Adi! Since you're continuing Data Engineering and prefer simple explanations, let's explore ETL Pipelines using a kitchen analogy..."
    </text>
    <rect x="880" y="25" width="170" height="28" rx="14" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.4" />
    <text x="965" y="44" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">⚡ Recalled from Hindsight</text>
  </g>
</svg>
